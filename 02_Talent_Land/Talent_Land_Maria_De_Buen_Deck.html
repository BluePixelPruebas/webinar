<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Land · UX y AI: El nuevo motor del crecimiento empresarial | María De Buen</title>
  
  <!-- Tipografía Oficial Onest y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ───────── BPDS 2027 & Talent Land Signature Palette ───────── */
    :root, [data-theme="dark"] {
      --bp-bg: oklch(0.11 0.035 248);
      --bp-bg-2: oklch(0.15 0.045 248);
      --bp-bg-surface: oklch(0.17 0.04 248);
      --bp-stage-bg: radial-gradient(circle at 50% 35%, #141e34 0%, #0a0e1a 100%);
      --bp-fg: oklch(0.98 0.003 250);
      --bp-muted: oklch(0.80 0.018 248);
      --bp-dim: oklch(0.65 0.014 248);
      --bp-line: color-mix(in oklab, var(--bp-fg) 12%, transparent);
      --bp-line-strong: color-mix(in oklab, var(--bp-fg) 20%, transparent);
      
      /* Talent Land Signature Accents */
      --tl-cyan: #00d2ff;
      --tl-cyan-soft: #16A2CD;
      --tl-coral: #ff6b4a;
      --tl-coral-vibrant: #e75125;
      --tl-mint: #2dd4bf;
      --tl-purple: #a855f7;

      --bp-gradient-cyan: linear-gradient(135deg, #00d2ff 0%, #16A2CD 100%);
      --bp-gradient-coral: linear-gradient(135deg, #ff6b4a 0%, #e75125 100%);
      --bp-gradient-paradox: linear-gradient(135deg, #00d2ff 0%, #ff6b4a 100%);
      
      --radius: 0.75rem;
      --radius-sm: 0.5rem;
      --shadow-elevated: 0 24px 48px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--bp-line);
      --shadow-glow-cyan: 0 0 40px rgba(0, 210, 255, 0.25);
      --shadow-glow-coral: 0 0 40px rgba(255, 107, 74, 0.25);
    }

    [data-theme="light"] {
      --bp-bg: #f8fafc;
      --bp-bg-2: #f1f5f9;
      --bp-bg-surface: #ffffff;
      --bp-stage-bg: radial-gradient(circle at 50% 35%, #ffffff 0%, #eef2f6 100%);
      --bp-fg: #090d16;
      --bp-muted: #334155;
      --bp-dim: #64748b;
      --bp-line: #cbd5e1;
      --bp-line-strong: #94a3b8;
      
      --tl-cyan: #0284c7;
      --tl-cyan-soft: #0369a1;
      --tl-coral: #ea580c;
      --tl-coral-vibrant: #c2410c;
      --tl-mint: #0d9488;
      --tl-purple: #7e22ce;

      --bp-gradient-cyan: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --bp-gradient-coral: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      --bp-gradient-paradox: linear-gradient(135deg, #0284c7 0%, #ea580c 100%);
      
      --shadow-elevated: 0 20px 40px -15px rgba(0, 0, 0, 0.1), 0 0 0 1px var(--bp-line);
      --shadow-glow-cyan: 0 0 30px rgba(2, 132, 199, 0.15);
      --shadow-glow-coral: 0 0 30px rgba(234, 88, 12, 0.15);
    }

    /* ───────── Reset & Base ───────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bp-bg);
      color: var(--bp-fg);
      -webkit-font-smoothing: antialiased;
    }

    /* ───────── Shell de la Aplicación ───────── */
    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* ───────── Header / Barra Superior ───────── */
    .top-bar {
      height: 60px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 85%, transparent);
      backdrop-filter: blur(16px);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 15px;
    }

    .logo-tl {
      background: #111;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo-bp {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo-bp-box {
      width: 12px;
      height: 12px;
      background: var(--tl-cyan);
      border-radius: 2px;
    }

    .brand-divider {
      color: var(--bp-dim);
      font-weight: 300;
      font-size: 14px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--bp-muted);
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 9999px;
      background: color-mix(in oklab, var(--tl-cyan) 14%, transparent);
      color: var(--tl-cyan);
      border: 1px solid color-mix(in oklab, var(--tl-cyan) 30%, transparent);
      letter-spacing: 0.05em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: var(--bp-bg-surface);
      border: 1px solid var(--bp-line);
      color: var(--bp-fg);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: color-mix(in oklab, var(--bp-fg) 8%, var(--bp-bg-surface));
      border-color: var(--bp-line-strong);
      transform: translateY(-1px);
    }

    .btn-action.primary {
      background: var(--bp-gradient-cyan);
      color: #000;
      font-weight: 700;
      border: none;
    }

    .btn-action.primary:hover {
      box-shadow: 0 4px 14px rgba(0, 210, 255, 0.4);
    }

    /* ───────── Barra de Progreso ───────── */
    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--bp-line);
      position: relative;
      flex-shrink: 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--bp-gradient-paradox);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ───────── Viewport / Escenario de la Lámina ───────── */
    .viewport {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background: var(--bp-bg);
      overflow: hidden;
    }

    .slide-stage {
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      max-height: 84vh;
      background: var(--bp-stage-bg);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-elevated);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.995); }
      to { opacity: 1; transform: scale(1); }
    }

    .slide-header {
      padding: 20px 36px 14px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 35%, transparent);
      flex-shrink: 0;
    }

    .slide-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--bp-dim);
    }

    .slide-speaker {
      font-size: 12px;
      color: var(--bp-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-speaker img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--tl-cyan);
    }

    .slide-speaker span {
      color: var(--tl-cyan);
      font-weight: 600;
    }

    .slide-content {
      flex: 1 1 auto;
      padding: 36px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
      position: relative;
    }

    .slide-footer {
      padding: 12px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 40%, transparent);
      flex-shrink: 0;
      font-size: 12px;
      color: var(--bp-dim);
    }

    /* ───────── Tipografía de Impacto Talent Land ───────── */
    .tl-display {
      font-size: clamp(2.4rem, 4.4vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--bp-fg);
      margin-bottom: 16px;
    }

    .tl-title {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--bp-fg);
      margin-bottom: 14px;
    }

    .tl-subtitle {
      font-size: clamp(1.05rem, 1.5vw, 1.35rem);
      color: var(--bp-muted);
      font-weight: 300;
      line-height: 1.5;
      max-width: 65ch;
    }

    .tl-cyan {
      color: var(--tl-cyan);
    }

    .tl-coral {
      color: var(--tl-coral);
    }

    .tl-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--tl-cyan);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tl-eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--tl-cyan);
      border-radius: 50%;
      display: inline-block;
    }

    /* ───────── Layouts & Tarjetas de Diapositiva ───────── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
      width: 100%;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
      margin-top: 24px;
    }

    .card {
      background: color-mix(in oklab, var(--bp-fg) 4%, transparent);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius);
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
      position: relative;
    }

    .card:hover {
      border-color: var(--bp-line-strong);
      transform: translateY(-2px);
    }

    .card.cyan-edge {
      border-top: 3px solid var(--tl-cyan);
    }

    .card.coral-edge {
      border-top: 3px solid var(--tl-coral);
    }

    .card.mint-edge {
      border-top: 3px solid var(--tl-mint);
    }

    /* Esferas Diagnóstico Trust-Flow-Delight */
    .sphere-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .sphere-card {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      position: relative;
      background: color-mix(in oklab, var(--bp-fg) 3%, transparent);
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sphere-card.trust {
      border: 2px solid var(--tl-cyan);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.15);
    }

    .sphere-card.flow {
      border: 2px solid var(--tl-mint);
      box-shadow: 0 0 30px rgba(45, 212, 191, 0.15);
    }

    .sphere-card.delight {
      border: 2px solid var(--tl-coral);
      box-shadow: 0 0 30px rgba(255, 107, 74, 0.15);
    }

    .sphere-card:hover {
      transform: scale(1.04);
    }

    .sphere-card.trust:hover {
      box-shadow: 0 0 50px rgba(0, 210, 255, 0.35);
    }

    .sphere-card.flow:hover {
      box-shadow: 0 0 50px rgba(45, 212, 191, 0.35);
    }

    .sphere-card.delight:hover {
      box-shadow: 0 0 50px rgba(255, 107, 74, 0.35);
    }

    .sphere-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .sphere-desc {
      font-size: 14px;
      line-height: 1.45;
      color: var(--bp-muted);
    }

    /* Vista Previa de Figma con Lightbox */
    .figma-preview-card {
      background: #000;
      border: 1px solid var(--bp-line);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      aspect-ratio: 16 / 9;
    }

    .figma-preview-card:hover {
      border-color: var(--tl-cyan);
      transform: scale(1.02);
      box-shadow: var(--shadow-glow-cyan);
    }

    .figma-preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .figma-preview-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ───────── Lightbox Modal ───────── */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 15, 0.95);
      backdrop-filter: blur(20px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.15);
      animation: zoomIn 0.2s ease-out;
    }

    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .btn-close-lightbox {
      position: absolute;
      top: 24px;
      right: 28px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-close-lightbox:hover {
      background: var(--tl-coral);
      border-color: var(--tl-coral);
    }

    /* ───────── Barra Inferior de Navegación ───────── */
    .bottom-bar {
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 85%, transparent);
      backdrop-filter: blur(16px);
      z-index: 50;
      flex-shrink: 0;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--bp-bg-surface);
      border: 1px solid var(--bp-line);
      color: var(--bp-fg);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-nav:hover {
      border-color: var(--tl-cyan);
      color: var(--tl-cyan);
      transform: translateY(-1px);
    }

    .counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      padding: 0 10px;
      color: var(--bp-fg);
    }

    /* ───────── Drawer de Notas del Orador ───────── */
    .notes-drawer {
      position: absolute;
      top: 60px;
      right: 0;
      bottom: 64px;
      width: 440px;
      background: color-mix(in oklab, var(--bp-bg-surface) 95%, transparent);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--bp-line);
      z-index: 90;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.4);
    }

    .notes-drawer.open {
      transform: translateX(0);
    }

    .notes-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--bp-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notes-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-body {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--bp-muted);
    }

    .notes-quote {
      background: color-mix(in oklab, var(--tl-cyan) 8%, transparent);
      border-left: 3px solid var(--tl-cyan);
      padding: 14px 16px;
      border-radius: 0 6px 6px 0;
      font-style: italic;
      color: var(--bp-fg);
    }

    .notes-meta-box {
      background: color-mix(in oklab, var(--bp-fg) 3%, transparent);
      border: 1px solid var(--bp-line);
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ───────── Modal Cuadrícula / Overview ───────── */
    .grid-modal {
      position: absolute;
      inset: 60px 0 64px 0;
      background: rgba(10, 14, 26, 0.94);
      backdrop-filter: blur(14px);
      z-index: 80;
      padding: 40px;
      overflow-y: auto;
      display: none;
    }

    .grid-modal.open {
      display: block;
    }

    .grid-container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .thumb-card {
      background: var(--bp-bg-surface);
      border: 1px solid var(--bp-line);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
      aspect-ratio: 16 / 10;
      position: relative;
    }

    .thumb-card:hover, .thumb-card.active {
      border-color: var(--tl-cyan);
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0, 210, 255, 0.25);
    }

    .thumb-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--bp-dim);
    }

    .thumb-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--bp-fg);
      line-height: 1.3;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .slide-stage { aspect-ratio: auto; min-height: 540px; }
      .notes-drawer { width: 100%; }
      .sphere-card { width: 100%; height: auto; border-radius: 12px; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="brand-logo-badge">
        <span class="logo-tl">TALENT LAND®</span>
        <span class="brand-divider">×</span>
        <div class="logo-bp">
          <div class="logo-bp-box"></div>
          <span>BLUEPIXEL</span>
        </div>
      </div>
      <span class="brand-tag">DECK 02 · CANON FIGMA 1346:2</span>
    </div>

    <div class="top-actions">
      <button class="btn-action" id="btn-theme" title="Cambiar Tema (T)">
        <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
      </button>
      <button class="btn-action" id="btn-grid" title="Ver Cuadrícula (G)">
        <span>▦</span> Cuadrícula
      </button>
      <button class="btn-action" id="btn-notes" title="Notas del Orador (N)">
        <span>🎙️</span> Guion Verbatim
      </button>
      <button class="btn-action primary" id="btn-fs" title="Pantalla Completa (F)">
        <span>⛶</span> Presentar
      </button>
    </div>
  </header>

  <!-- Barra de Progreso Superior -->
  <div class="progress-track">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  /* ───────── Modal Cuadrícula / Overview ───────── */
  function initGridModal() {
    gridContainer.innerHTML = SLIDES.map((slide, i) => `
      <div class="thumb-card ${i === currentSlideIndex ? 'active' : ''}" onclick="goToSlide(${i})">

  function updateGridHighlight() {
    const cards = gridContainer.querySelectorAll('.thumb-card');
    cards.forEach((c, idx) => {
      if (idx === currentSlideIndex) {
        c.classList.add('active');
      } else {
        c.classList.remove('active');
      }
    });
  }

  function goToSlide(index) {
    renderSlide(index);
    gridModal.classList.remove('open');

  function toggleGrid() {
    gridModal.classList.toggle('open');

  function toggleNotes() {
    notesDrawer.classList.toggle('open');
  }

  /* ───────── Lightbox ───────── */
  function openLightbox(src) {
    lightboxImg.src = src;
    lightboxModal.classList.add('open');
  }

    lightboxModal.classList.remove('open');
    lightboxImg.src = '';
  }

  /* ───────── Controles y Navegación ───────── */
  function nextSlide() {
    if (currentSlideIndex < SLIDES.length - 1) {
      renderSlide(currentSlideIndex + 1);
    }
  }

  function prevSlide() {
    if (currentSlideIndex > 0) {
      renderSlide(currentSlideIndex - 1);
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      isFullscreen = true;
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
        isFullscreen = false;
      }
    }
  }

  function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme') || 'dark';
    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', nextTheme);

    const icon = document.getElementById('theme-icon');
    const text = document.getElementById('theme-text');
    if (nextTheme === 'light') {
      icon.textContent = '🌙';
      text.textContent = 'Modo Oscuro';
    } else {
      icon.textContent = '☀️';
      text.textContent = 'Modo Claro';
    }
  }

  window.addEventListener('keydown', (e) => {
    // Si modal lightbox está abierto, Esc lo cierra

      return;
    }

    // Si modal de cuadrícula está abierto, Esc lo cierra
    if (gridModal.classList.contains('open')) {
      if (e.key === 'Escape') gridModal.classList.remove('open');
      return;

    if (e.key === 'ArrowRight' || e.key === ' ') {

    } else if (e.key === 'End') {
      e.preventDefault();
      renderSlide(SLIDES.length - 1);
    } else if (e.key.toLowerCase() === 'n') {
      toggleNotes();
    } else if (e.key.toLowerCase() === 'g') {
      toggleGrid();
    } else if (e.key.toLowerCase() === 'f') {
      toggleFullscreen();
    } else if (e.key.toLowerCase() === 't') {
      toggleTheme();
    }
  });

  /* Event Listeners */
  document.getElementById('btn-next').addEventListener('click', nextSlide);
  document.getElementById('btn-prev').addEventListener('click', prevSlide);
  document.getElementById('btn-notes').addEventListener('click', toggleNotes);
  document.getElementById('btn-close-notes').addEventListener('click', toggleNotes);
  document.getElementById('btn-grid').addEventListener('click', toggleGrid);
  document.getElementById('btn-close-grid').addEventListener('click', toggleGrid);
  document.getElementById('btn-fs').addEventListener('click', toggleFullscreen);
  document.getElementById('btn-theme').addEventListener('click', toggleTheme);
  document.getElementById('btn-close-lightbox').addEventListener('click', closeLightbox);
  lightboxModal.addEventListener('click', (e) => {
    if (e.target === lightboxModal) closeLightbox();
  });

  /* ───────── Inicialización ───────── */
  initGridModal();
  renderSlide(0);
</script>

</body>
</html>
