<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>«UX en la era agéntica»: La relevancia del diseño UX/UI para crecimiento empresarial · María de Buen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ───────── BPDS 2027 Tokens · Estilo Auténtico de María de Buen ───────── */
    :root {
      --font-sans: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --bp-bg: oklch(0.12 0.025 255);
      --bp-surface: oklch(0.17 0.035 255);
      --bp-surface-elevated: oklch(0.22 0.045 255);
      --bp-line: oklch(0.28 0.04 255);
      --bp-line-subtle: oklch(0.22 0.03 255);

      --bp-fg: oklch(0.98 0.01 255);
      --bp-muted: oklch(0.80 0.02 255);
      --bp-dim: oklch(0.55 0.02 255);

      --tl-cyan: oklch(0.82 0.17 215);
      --tl-mint: oklch(0.80 0.16 165);
      --tl-coral: oklch(0.75 0.20 28);
      --tl-navy: oklch(0.18 0.05 250);

      --bp-gradient-cyan: linear-gradient(135deg, var(--tl-cyan) 0%, oklch(0.65 0.18 245) 100%);
      --bp-gradient-coral: linear-gradient(135deg, var(--tl-coral) 0%, oklch(0.68 0.22 15) 100%);
      --bp-gradient-mesh: radial-gradient(circle at 10% 20%, oklch(0.22 0.08 240 / 0.5) 0%, transparent 45%),
                           radial-gradient(circle at 90% 80%, oklch(0.22 0.09 310 / 0.35) 0%, transparent 50%),
                           radial-gradient(circle at 50% 50%, oklch(0.15 0.04 255 / 0.8) 0%, transparent 100%);

      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --shadow-elevation: 0 16px 40px -12px rgba(0, 0, 0, 0.45);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bp-bg: oklch(0.97 0.01 250);
      --bp-surface: oklch(1 0 0);
      --bp-surface-elevated: oklch(0.95 0.015 250);
      --bp-line: oklch(0.88 0.015 250);
      --bp-line-subtle: oklch(0.92 0.01 250);
      --bp-fg: oklch(0.18 0.03 255);
      --bp-muted: oklch(0.38 0.02 255);
      --bp-dim: oklch(0.55 0.02 255);
      --tl-cyan: oklch(0.52 0.19 225);
      --tl-mint: oklch(0.50 0.16 165);
      --tl-coral: oklch(0.58 0.20 28);
      --bp-gradient-mesh: radial-gradient(circle at 10% 20%, oklch(0.92 0.05 220 / 0.5) 0%, transparent 45%),
                           radial-gradient(circle at 90% 80%, oklch(0.92 0.06 310 / 0.3) 0%, transparent 50%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bp-bg);
      color: var(--bp-fg);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s var(--ease-smooth), color 0.3s var(--ease-smooth);
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .top-bar {
      height: 60px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 85%, transparent);
      backdrop-filter: blur(16px);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in oklab, var(--tl-cyan) 12%, transparent);
      color: var(--tl-cyan);
      border: 1px solid color-mix(in oklab, var(--tl-cyan) 30%, transparent);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--bp-muted);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      color: var(--bp-fg);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-icon:hover {
      background: var(--bp-surface-elevated);
      border-color: var(--tl-cyan);
      color: var(--tl-cyan);
      transform: translateY(-1px);
    }

    .btn-icon.active {
      background: var(--tl-cyan);
      color: oklch(0.12 0.025 255);
      border-color: var(--tl-cyan);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--bp-muted);
      padding: 0 8px;
    }

    .stage-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 32px;
      background: var(--bp-gradient-mesh);
    }

    .slide-canvas {
      width: 100%;
      max-width: 1340px;
      height: 100%;
      max-height: 800px;
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevation);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 44px 56px;
    }

    .tl-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--tl-cyan);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .tl-eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--tl-cyan);
      border-radius: 2px;
    }

    .tl-display {
      font-size: clamp(2.2rem, 4.2vw, 3.8rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.04em;
      color: var(--bp-fg);
      margin-bottom: 18px;
    }

    .tl-title {
      font-size: clamp(1.8rem, 3.2vw, 2.7rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--bp-fg);
      margin-bottom: 14px;
    }

    .tl-subtitle {
      font-size: clamp(1.05rem, 1.35vw, 1.25rem);
      font-weight: 400;
      line-height: 1.55;
      color: var(--bp-muted);
      max-width: 78ch;
    }

    .highlight-cyan, .tl-cyan { color: var(--tl-cyan); }
    .highlight-mint, .tl-mint { color: var(--tl-mint); }
    .highlight-coral, .tl-coral { color: var(--tl-coral); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
      height: 100%;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 100%;
    }

    .card {
      background: var(--bp-surface-elevated);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s var(--ease-smooth);
    }

    .card:hover {
      border-color: var(--tl-cyan);
      transform: translateY(-2px);
    }

    .card-cyan { border-top: 4px solid var(--tl-cyan); }
    .card-mint { border-top: 4px solid var(--tl-mint); }
    .card-coral { border-top: 4px solid var(--tl-coral); }

    .figma-preview-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--bp-line);
      background: #000;
      box-shadow: var(--shadow-elevation);
      max-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .figma-preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bottom-bar {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 90%, transparent);
      z-index: 50;
      flex-shrink: 0;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--bp-line);
      border-radius: 2px;
      margin: 0 24px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--tl-cyan);
      transition: width 0.3s var(--ease-smooth);
    }

    .key-hints {
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--bp-dim);
    }

    .key-hint kbd {
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--bp-muted);
    }

    .notes-drawer {
      position: absolute;
      right: 0;
      top: 60px;
      bottom: 52px;
      width: 420px;
      background: var(--bp-surface);
      border-left: 1px solid var(--bp-line);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      z-index: 90;
      transform: translateX(100%);
      transition: transform 0.3s var(--ease-smooth);
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .notes-drawer.open { transform: translateX(0); }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bp-line);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .notes-speech {
      font-size: 14px;
      line-height: 1.7;
      color: var(--bp-fg);
      background: color-mix(in oklab, var(--bp-surface-elevated) 60%, transparent);
      padding: 16px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--tl-cyan);
    }

    .grid-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 40px;
      overflow-y: auto;
    }

    .grid-modal.open { display: flex; }

    .grid-thumbnails {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .thumb-card {
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius-sm);
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s var(--ease-smooth);
    }

    .thumb-card:hover {
      border-color: var(--tl-cyan);
      transform: translateY(-2px);
    }

    .thumb-card.active {
      border-color: var(--tl-cyan);
      box-shadow: 0 0 0 2px var(--tl-cyan);
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bp-surface-elevated);
      color: var(--bp-fg);
      border: 1px solid var(--bp-line);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-action:hover {
      border-color: var(--tl-cyan);
      color: var(--tl-cyan);
    }

    .btn-action.primary {
      background: var(--tl-cyan);
      color: oklch(0.12 0.025 255);
      border-color: var(--tl-cyan);
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand-group">
        <span class="logo-badge">BluePixel · María de Buen</span>
        <span class="brand-title">«UX en la era agéntica»: La relevancia del diseño UX/UI para crecimiento empresarial</span>
      </div>
      <div class="controls-group">
        <button class="btn-icon" id="btn-theme" title="Alternar tema claro/oscuro (T)">☀️</button>
        <button class="btn-icon" id="btn-notes" title="Guion de María (N)">📝</button>
        <button class="btn-icon" id="btn-grid" title="Ver cuadrícula (G)">⊞</button>
        <button class="btn-icon" id="btn-fullscreen" title="Pantalla completa (F)">⛶</button>
        <span class="slide-counter" id="slide-counter">01 / 13</span>
      </div>
    </header>

    <main class="stage-container" id="stage-container">
      <div class="slide-canvas" id="slide-canvas"></div>
    </main>

    <footer class="bottom-bar">
      <button class="btn-icon" id="btn-prev" title="Anterior (←)">←</button>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 7.69%;"></div>
      </div>
      <button class="btn-icon" id="btn-next" title="Siguiente (→)">→</button>
      <div class="key-hints">
        <span class="key-hint"><kbd>→</kbd> Avanzar</span>
        <span class="key-hint"><kbd>N</kbd> Guion de María</span>
        <span class="key-hint"><kbd>G</kbd> Índice</span>
        <span class="key-hint"><kbd>F</kbd> Fullscreen</span>
      </div>
    </footer>

    <aside class="notes-drawer" id="notes-drawer">
      <div class="notes-header">
        <h4 style="font-size: 13px; font-weight: 800; color: var(--tl-cyan); letter-spacing: 0.05em;">🎙️ GUION VERBATIM DE MARÍA</h4>
        <button class="btn-icon" id="btn-close-notes" style="width: 28px; height: 28px;">✕</button>
      </div>
      <div id="notes-content"></div>
    </aside>

    <div class="grid-modal" id="grid-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bp-line); padding-bottom: 16px;">
        <h3 style="font-size: 20px; font-weight: 800;">Mapa General de la Ponencia (13 Láminas)</h3>
        <button class="btn-icon" id="btn-close-grid">✕</button>
      </div>
      <div class="grid-thumbnails" id="grid-thumbnails"></div>
    </div>
  </div>

  <script>
    /* ───────── Textos Auténticos de María de Buen (Figma 1231:2 y 1346:2) ───────── */
    const SLIDES = [
      {
        id: "01",
        eyebrow: "MARÍA DE BUEN · BLUEPIXEL",
        title: "«UX en la era agéntica»",
        subtitle: "La relevancia del diseño UX/UI para crecimiento empresarial",
        render: () => `
          <div class="grid-2">
            <div style="display: flex; flex-direction: column; justify-content: center;">
              <span class="tl-eyebrow">MARÍA DE BUEN · CEO @BLUEPIXEL</span>
              <h1 class="tl-display">«UX en la <span class="highlight-cyan">era agéntica</span>»</h1>
              <p class="tl-subtitle" style="font-size: 1.4rem; font-weight: 700; color: var(--bp-fg); margin-bottom: 16px;">
                La relevancia del diseño UX/UI para crecimiento empresarial.
              </p>
              <p class="tl-subtitle" style="margin-bottom: 24px;">
                "La inteligencia artificial impresiona… pero la experiencia… es la que cambia el negocio."
              </p>
              <div style="display: flex; align-items: center; gap: 14px; background: var(--bp-surface-elevated); padding: 12px 18px; border-radius: var(--radius); border: 1px solid var(--bp-line); width: fit-content;">
                <img src="assets/maria_de_buen_foto.png" alt="María de Buen" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--tl-cyan);">
                <div>
                  <div style="font-weight: 700; font-size: 15px;">María de Buen</div>
                  <div style="font-size: 12px; color: var(--bp-muted);">CEO @BluePixel · Software that Feels Right</div>
                </div>
              </div>
            </div>
            <div class="figma-preview-card">
              <img src="assets/talent_01_cover.png" alt="Portada Oficial">
            </div>
          </div>
        `,
        notes: {
          time: "1:00 min",
          keyIdea: "Apertura en la voz de María: la tecnología puede hacer más, pero el ser humano decide si se usa.",
          speech: "Muchas gracias, qué gusto estar con ustedes hoy.<br><br>Hoy estamos viviendo uno de los momentos más importantes en la historia de la tecnología. La inteligencia artificial está cambiando todo: cómo trabajamos, cómo creamos, cómo tomamos decisiones.<br><br>(Pausa)<br><br>Pero hay algo que no está cambiando: las personas. Las personas siguen buscando lo mismo: claridad, simplicidad, confianza y experiencias que se sientan bien.<br><br>Y por eso, la pregunta hoy no es quién tiene la mejor inteligencia artificial. La pregunta es: ¿quién va a diseñar las experiencias que hagan que esa inteligencia realmente se use? Porque en esta nueva era… la tecnología ya no es el diferenciador. La experiencia lo es."
        }
      },
      {
        id: "02",
        eyebrow: "NOVIEMBRE DE 2022 · FIGMA 1346:30 & 1335:187",
        title: "¿Fue la IA lo que cambió el mundo… o fue el diseño de la experiencia?",
        subtitle: "1 millón de usuarios en 5 días: la verdadera genialidad de OpenAI no fue la tecnología, fue la interfaz.",
        render: () => `
          <div class="grid-2">
            <div style="display: flex; flex-direction: column; justify-content: center;">
              <span class="tl-eyebrow">EL EFECTO NOVIEMBRE 2022</span>
              <h2 class="tl-title">¿Fue la IA lo que cambió el mundo…<br><span class="highlight-cyan">o fue el diseño de la experiencia?</span></h2>
              <p class="tl-subtitle" style="margin-bottom: 20px;">
                OpenAI lanzó ChatGPT. Y de pronto… millones de personas empezaron a usar inteligencia artificial. Pero lo interesante... es que la inteligencia artificial ya existía desde hacía años. No era nueva.
              </p>
              <div class="card card-cyan">
                <div style="font-weight: 700; color: var(--tl-cyan);">Lo que cambió todo fue algo mucho más simple:</div>
                <p style="font-size: 14px; color: var(--bp-fg); margin: 0; line-height: 1.55;">
                  Por primera vez, millones de personas podían usar inteligencia artificial escribiendo una pregunta en una <strong>simple caja de texto</strong>. Sin manual. Sin entrenamiento. Sin curva de aprendizaje.
                </p>
              </div>
            </div>
            <div class="figma-preview-card">
              <img src="assets/talent_02_hook.png" alt="Hook OpenAI">
            </div>
          </div>
        `,
        notes: {
          time: "1:45 min",
          keyIdea: "Texto verbatim de María (Figma 1335:187): el valor de ChatGPT estuvo en la experiencia de una simple caja de texto.",
          speech: "En noviembre de 2022 pasó algo muy curioso en el mundo de la tecnología. ¿Alguien se acuerda qué pasó?...<br><br>(Pausa)<br><br>OpenAI lanzó ChatGPT. (Pausa) Y de pronto… millones de personas empezaron a usar inteligencia artificial.<br><br>Pero lo interesante... es que la inteligencia artificial ya existía desde hacía años. (Pausa) No era nueva. Lo que cambió todo (Pausa más larga) fue algo mucho más simple: la experiencia.<br><br>Por primera vez, millones de personas podían usar inteligencia artificial escribiendo una pregunta en una simple caja de texto. Sin manual. Sin entrenamiento. Sin curva de aprendizaje.<br><br>¿El resultado? ChatGPT se convirtió en la aplicación que más rápido ha crecido en la historia del software. 1 millón de usuarios en 5 días. Pausa.<br><br>Y eso nos deja una pregunta muy interesante… ¿Fue la inteligencia artificial lo que cambió el mundo… o fue el diseño de la experiencia?"
        }
      },
      {
        id: "03",
        eyebrow: "INTERACCIÓN CON EL AUDITORIO · FIGMA 1346:69 & 1231:131",
        title: "¿Quién de aquí sabe usar Excel?",
        subtitle: "La tecnología nunca había sido tan poderosa… pero el impacto viene de qué tan fácil es usarla.",
        render: () => `
          <div class="grid-2">
            <div style="display: flex; flex-direction: column; justify-content: center;">
              <span class="tl-eyebrow">INTERACCIÓN CON EL AUDITORIO</span>
              <h2 class="tl-title">¿Quién de aquí sabe <span class="highlight-mint">usar Excel</span>?</h2>
              <p class="tl-subtitle" style="margin-bottom: 20px;">
                Excel es una de las herramientas más poderosas que existen. Puedes hacer análisis, modelos, proyecciones… Pero la realidad es que la mayoría de las personas usa solo una pequeña parte de lo que puede hacer.
              </p>
              <div class="card card-mint">
                <div style="font-weight: 700; color: var(--tl-mint);">Ahora imaginen lo mismo…</div>
                <p style="font-size: 14px; color: var(--bp-fg); margin: 0; line-height: 1.55;">
                  En lugar de construir fórmulas, tablas dinámicas y modelos… solo pudieran escribir: <em>“Analiza estos datos y dime qué está pasando.”</em> Es la misma capacidad... pero una experiencia completamente distinta.
                </p>
              </div>
            </div>
            <div class="figma-preview-card">
              <img src="assets/talent_03_excel.png" alt="Excel 3D">
            </div>
          </div>
        `,
        notes: {

          speech: "Hoy estamos viviendo uno de los momentos más importantes en la historia de la tecnología. (Pausa)<br><br>La inteligencia artificial está cambiando todo: Cómo trabajamos. Cómo creamos. Cómo tomamos decisiones. (Pausa)<br><br>Pero hay algo que no está cambiando. (Pausa larga)<br><br>Las personas. Las personas siguen buscando lo mismo: claridad, simplicidad, confianza y experiencias que se sientan bien.<br><br>Y por eso, la pregunta no es quién tiene la mejor inteligencia artificial. La pregunta es: ¿Quién va a diseñar las experiencias que hagan que esa inteligencia realmente se use?<br><br>Porque en esta nueva era… la tecnología ya no es el diferenciador. (Pausa) La experiencia lo es.<br><br>La inteligencia artificial va a seguir evolucionando. Pero las empresas que van a ganar… son las que entiendan algo muy simple:<br><br>No se trata de construir tecnología impresionante. (Pausa) Se trata de construir cosas que la gente realmente quiera usar.<br><br>(Última pausa — bajo un poco la voz)<br><br>Porque la inteligencia artificial impresiona… pero la experiencia… es la que cambia el negocio. (Pausa)<br><br>“La tecnología puede hacer más…” (Pausa larga) “pero las personas… siguen sintiendo lo mismo.”<br><br>Software that Feels Right.<br>Muchas gracias a todos."

    /* ───────── Navegación & Control ───────── */
    let currentSlide = 0;

    const counter = document.getElementById('slide-counter');

    const notesDrawer = document.getElementById('notes-drawer');
    const notesContent = document.getElementById('notes-content');
    const gridModal = document.getElementById('grid-modal');
    const gridThumbnails = document.getElementById('grid-thumbnails');

    function renderCurrentSlide() {
      const slide = SLIDES[currentSlide];
      canvas.innerHTML = slide.render();
      counter.textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
      progress.style.width = `${((currentSlide + 1) / SLIDES.length) * 100}%`;
      updateNotes();
    }

    function updateNotes() {
      const slide = SLIDES[currentSlide];
      notesContent.innerHTML = `
        <div style="margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-family: var(--font-mono); font-size: 12px; color: var(--tl-cyan); font-weight: 700;">LÁMINA ${slide.id} · ${slide.notes.time}</span>
        </div>
        <div style="font-size: 11px; font-weight: 700; color: var(--bp-muted); text-transform: uppercase; margin-bottom: 6px;">Tesis / Idea Clave:</div>
        <div style="font-size: 13px; color: var(--bp-fg); margin-bottom: 16px; font-weight: 500;">${slide.notes.keyIdea}</div>
        <div style="font-size: 11px; font-weight: 700; color: var(--bp-muted); text-transform: uppercase; margin-bottom: 6px;">Guion Verbatim (Voz de María):</div>
        <div class="notes-speech">${slide.notes.speech}</div>
      `;
    }

    function nextSlide() { if (currentSlide < SLIDES.length - 1) { currentSlide++; renderCurrentSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderCurrentSlide(); } }
    function goToSlide(index) { if (index >= 0 && index < SLIDES.length) { currentSlide = index; renderCurrentSlide(); closeGrid(); } }
    function toggleNotes() { notesDrawer.classList.toggle('open'); document.getElementById('btn-notes').classList.toggle('active', notesDrawer.classList.contains('open')); }
    function openGrid() {
      gridThumbnails.innerHTML = SLIDES.map((s, idx) => `
        <div class="thumb-card ${idx === currentSlide ? 'active' : ''}" onclick="goToSlide(${idx})">
          <div style="font-family: var(--font-mono); font-size: 11px; color: var(--tl-cyan); font-weight: 700; margin-bottom: 4px;">LÁMINA ${s.id}</div>
          <div style="font-size: 13px; font-weight: 700; color: var(--bp-fg); margin-bottom: 4px; line-height: 1.25;">${s.title}</div>
          <div style="font-size: 11px; color: var(--bp-dim);">${s.eyebrow}</div>
        </div>
      `).join('');
      gridModal.classList.add('open');
    }
    function closeGrid() { gridModal.classList.remove('open'); }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err)); else document.exitFullscreen(); }
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('btn-theme').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    document.getElementById('btn-next').addEventListener('click', nextSlide);
    document.getElementById('btn-prev').addEventListener('click', prevSlide);
    document.getElementById('btn-notes').addEventListener('click', toggleNotes);
    document.getElementById('btn-close-notes').addEventListener('click', toggleNotes);
    document.getElementById('btn-grid').addEventListener('click', openGrid);
    document.getElementById('btn-close-grid').addEventListener('click', closeGrid);
    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('btn-theme').addEventListener('click', toggleTheme);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.key) {
        case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); nextSlide(); break;
        case 'ArrowLeft': case 'PageUp': e.preventDefault(); prevSlide(); break;
        case 'n': case 'N': toggleNotes(); break;
        case 'g': case 'G': if (gridModal.classList.contains('open')) closeGrid(); else openGrid(); break;
        case 'f': case 'F': toggleFullscreen(); break;
        case 't': case 'T': toggleTheme(); break;
        case 'Escape': if (gridModal.classList.contains('open')) closeGrid(); if (notesDrawer.classList.contains('open')) toggleNotes(); break;
      }
    });

    renderCurrentSlide();
  </script>
