<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>«UX en la era agéntica»: La relevancia del diseño UX/UI para crecimiento empresarial · María de Buen (BluePixel)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ───────── BPDS 2027 Tokens · Webinar Era Agéntica ───────── */
    :root {
      --font-sans: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* OKLCH Color Tokens */
      --bp-bg: oklch(0.12 0.025 255);
      --bp-surface: oklch(0.17 0.035 255);
      --bp-surface-elevated: oklch(0.22 0.045 255);
      --bp-line: oklch(0.28 0.04 255);
      --bp-line-subtle: oklch(0.22 0.03 255);

      --bp-fg: oklch(0.98 0.01 255);
      --bp-muted: oklch(0.78 0.02 255);
      --bp-dim: oklch(0.55 0.02 255);

      /* Accent Highlights */
      --agent-cyan: oklch(0.82 0.17 215);
      --agent-mint: oklch(0.80 0.16 165);
      --agent-coral: oklch(0.75 0.20 28);
      --agent-purple: oklch(0.76 0.21 310);
      --agent-amber: oklch(0.85 0.17 85);

      --bp-gradient-cyan: linear-gradient(135deg, var(--agent-cyan) 0%, oklch(0.65 0.18 245) 100%);
      --bp-gradient-coral: linear-gradient(135deg, var(--agent-coral) 0%, oklch(0.68 0.22 15) 100%);
      --bp-gradient-mint: linear-gradient(135deg, var(--agent-mint) 0%, oklch(0.70 0.15 185) 100%);
      --bp-gradient-mesh: radial-gradient(circle at 10% 20%, oklch(0.22 0.08 240 / 0.5) 0%, transparent 45%),
                           radial-gradient(circle at 90% 80%, oklch(0.22 0.09 310 / 0.35) 0%, transparent 50%),
                           radial-gradient(circle at 50% 50%, oklch(0.15 0.04 255 / 0.8) 0%, transparent 100%);

      --radius: 14px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --shadow-elevation: 0 16px 40px -12px rgba(0, 0, 0, 0.45);
      --shadow-glow: 0 0 32px -4px color-mix(in oklab, var(--agent-cyan) 30%, transparent);

      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bp-bg: oklch(0.97 0.01 250);
      --bp-surface: oklch(1 0 0);
      --bp-surface-elevated: oklch(0.95 0.015 250);
      --bp-line: oklch(0.88 0.015 250);
      --bp-line-subtle: oklch(0.92 0.01 250);
      --bp-fg: oklch(0.18 0.03 255);
      --bp-muted: oklch(0.38 0.02 255);
      --bp-dim: oklch(0.55 0.02 255);
      --agent-cyan: oklch(0.52 0.19 225);
      --agent-mint: oklch(0.50 0.16 165);
      --agent-coral: oklch(0.58 0.20 28);
      --agent-purple: oklch(0.54 0.21 310);
      --bp-gradient-mesh: radial-gradient(circle at 10% 20%, oklch(0.92 0.05 220 / 0.5) 0%, transparent 45%),
                           radial-gradient(circle at 90% 80%, oklch(0.92 0.06 310 / 0.3) 0%, transparent 50%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bp-bg);
      color: var(--bp-fg);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s var(--ease-smooth), color 0.3s var(--ease-smooth);
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* ───────── Header / Barra Superior ───────── */
    .top-bar {
      height: 60px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 85%, transparent);
      backdrop-filter: blur(16px);
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in oklab, var(--agent-cyan) 12%, transparent);
      color: var(--agent-cyan);
      border: 1px solid color-mix(in oklab, var(--agent-cyan) 30%, transparent);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--bp-muted);
      letter-spacing: -0.01em;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      color: var(--bp-fg);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-icon:hover {
      background: var(--bp-surface-elevated);
      border-color: var(--agent-cyan);
      color: var(--agent-cyan);
      transform: translateY(-1px);
    }

    .btn-icon.active {
      background: var(--agent-cyan);
      color: oklch(0.12 0.025 255);
      border-color: var(--agent-cyan);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--bp-muted);
      padding: 0 8px;
    }

    /* ───────── Escenario Principal (Slide Stage) ───────── */
    .stage-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 32px;
      background: var(--bp-gradient-mesh);
    }

    .slide-canvas {
      width: 100%;
      max-width: 1340px;
      height: 100%;
      max-height: 800px;
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevation);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 44px 56px;
      transition: transform 0.35s var(--ease-smooth), opacity 0.35s var(--ease-smooth);
    }

    /* ───────── Elementos Tipográficos & Componentes ───────── */
    .agent-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--agent-cyan);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .agent-eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--agent-cyan);
      border-radius: 2px;
    }

    .agent-display {
      font-size: clamp(2.2rem, 4.2vw, 3.8rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--bp-fg);
      margin-bottom: 18px;
    }

    .agent-title {
      font-size: clamp(1.8rem, 3.2vw, 2.7rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--bp-fg);
      margin-bottom: 14px;
    }

    .agent-subtitle {
      font-size: clamp(1.05rem, 1.4vw, 1.25rem);
      font-weight: 400;
      line-height: 1.55;
      color: var(--bp-muted);
      max-width: 78ch;
    }

    .highlight-cyan { color: var(--agent-cyan); }
    .highlight-mint { color: var(--agent-mint); }
    .highlight-coral { color: var(--agent-coral); }
    .highlight-purple { color: var(--agent-purple); }

    /* Layout Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
      height: 100%;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 100%;
    }

    /* Cards */
    .agent-card {
      background: var(--bp-surface-elevated);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s var(--ease-smooth);
      position: relative;
      overflow: hidden;
    }

    .agent-card:hover {
      border-color: var(--agent-cyan);
      box-shadow: 0 8px 24px -6px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }

    .card-cyan { border-top: 4px solid var(--agent-cyan); }
    .card-mint { border-top: 4px solid var(--agent-mint); }
    .card-coral { border-top: 4px solid var(--agent-coral); }
    .card-purple { border-top: 4px solid var(--agent-purple); }

    .takeaway-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: color-mix(in oklab, var(--agent-cyan) 14%, transparent);
      border: 1px solid color-mix(in oklab, var(--agent-cyan) 35%, transparent);
      color: var(--agent-cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      margin-bottom: 8px;
      width: fit-content;
    }

    /* Imagen Figma preview */
    .figma-preview-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--bp-line);
      background: #000;
      box-shadow: var(--shadow-elevation);
      max-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .figma-preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease-smooth);
    }

    .figma-preview-card:hover img {
      transform: scale(1.02);
    }

    /* ───────── Barra Inferior / Progreso ───────── */
    .bottom-bar {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 90%, transparent);
      z-index: 50;
      flex-shrink: 0;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--bp-line);
      border-radius: 2px;
      margin: 0 24px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--agent-cyan);
      transition: width 0.3s var(--ease-smooth);
    }

    .key-hints {
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--bp-dim);
    }

    .key-hint kbd {
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--bp-muted);
    }

    /* ───────── Gaveta de Notas del Orador (Tecla N) ───────── */
    .notes-drawer {
      position: absolute;
      right: 0;
      top: 60px;
      bottom: 52px;
      width: 380px;
      background: var(--bp-surface);
      border-left: 1px solid var(--bp-line);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      z-index: 90;
      transform: translateX(100%);
      transition: transform 0.3s var(--ease-smooth);
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .notes-drawer.open {
      transform: translateX(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bp-line);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .notes-speech {
      font-size: 14px;
      line-height: 1.65;
      color: var(--bp-fg);
      background: color-mix(in oklab, var(--bp-surface-elevated) 60%, transparent);
      padding: 16px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--agent-cyan);
    }

    /* ───────── Modal de Cuadrícula (Tecla G) ───────── */
    .grid-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 40px;
      overflow-y: auto;
    }

    .grid-modal.open {
      display: flex;
    }

    .grid-thumbnails {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .thumb-card {
      background: var(--bp-surface);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius-sm);
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s var(--ease-smooth);
    }

    .thumb-card:hover {
      border-color: var(--agent-cyan);
      transform: translateY(-2px);
    }

    .thumb-card.active {
      border-color: var(--agent-cyan);
      box-shadow: 0 0 0 2px var(--agent-cyan);
    }

    /* ───────── Botones de Acción ───────── */
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bp-surface-elevated);
      color: var(--bp-fg);
      border: 1px solid var(--bp-line);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s var(--ease-smooth);
    }

    .btn-action:hover {
      border-color: var(--agent-cyan);
      color: var(--agent-cyan);
      transform: translateY(-1px);
    }

    .btn-action.primary {
      background: var(--agent-cyan);
      color: oklch(0.12 0.025 255);
      border-color: var(--agent-cyan);
    }

    .btn-action.primary:hover {
      background: color-mix(in oklab, var(--agent-cyan) 90%, white);
      transform: translateY(-1px);
      box-shadow: var(--shadow-glow);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Barra Superior -->
    <header class="top-bar">
      <div class="brand-group">
        <span class="logo-badge">BluePixel Talks · Webinar B2B</span>
        <span class="brand-title">«UX en la era agéntica»: La relevancia del diseño UX/UI para crecimiento empresarial</span>
      </div>
      <div class="controls-group">
        <button class="btn-icon" id="btn-theme" title="Alternar tema claro/oscuro (T)">☀️</button>
        <button class="btn-icon" id="btn-notes" title="Notas del orador (N)">📝</button>
        <button class="btn-icon" id="btn-grid" title="Ver cuadrícula de láminas (G)">⊞</button>
        <button class="btn-icon" id="btn-fullscreen" title="Pantalla completa (F)">⛶</button>
        <span class="slide-counter" id="slide-counter">01 / 13</span>
      </div>
    </header>

    <!-- Escenario Principal -->
    <main class="stage-container" id="stage-container">
      <div class="slide-canvas" id="slide-canvas">
        <!-- Contenido inyectado dinámicamente -->
      </div>
    </main>

    <!-- Barra Inferior -->
    <footer class="bottom-bar">
      <button class="btn-icon" id="btn-prev" title="Lámina anterior (← o Flecha Arriba)">←</button>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 7.69%;"></div>
      </div>
      <button class="btn-icon" id="btn-next" title="Siguiente lámina (→ o Espacio)">→</button>
      <div class="key-hints">
        <span class="key-hint"><kbd>→</kbd> Avanzar</span>
        <span class="key-hint"><kbd>N</kbd> Notas</span>
        <span class="key-hint"><kbd>G</kbd> Índice</span>
        <span class="key-hint"><kbd>F</kbd> Fullscreen</span>
      </div>
    </footer>

    <!-- Gaveta de Notas del Orador -->
    <aside class="notes-drawer" id="notes-drawer">
      <div class="notes-header">
        <h4 style="font-size: 14px; font-weight: 700; color: var(--agent-cyan);">🎙️ NOTAS DEL ORADOR · MARÍA</h4>
        <button class="btn-icon" id="btn-close-notes" style="width: 28px; height: 28px;">✕</button>
      </div>
      <div id="notes-content">
        <!-- Notas inyectadas -->
      </div>
    </aside>

    <!-- Modal de Cuadrícula -->
    <div class="grid-modal" id="grid-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bp-line); padding-bottom: 16px;">
        <h3 style="font-size: 20px; font-weight: 800;">Mapa General de la Ponencia (13 Láminas)</h3>
        <button class="btn-icon" id="btn-close-grid">✕</button>
      </div>
      <div class="grid-thumbnails" id="grid-thumbnails">
        <!-- Miniaturas generadas dinámicamente -->
      </div>
    </div>
  </div>

  <script>
    /* ───────── Definición Oficial de las 13 Láminas ───────── */
    const SLIDES = [
      {
        id: "01",
        eyebrow: "WEBINAR EXCLUSIVO · BLUEPIXEL TALKS 2026",
        title: "«UX en la era agéntica»",
        subtitle: "La relevancia del diseño UX/UI para el crecimiento empresarial y la adopción de agentes autónomos.",
        type: "COVER",
        render: () => `
          <div class="grid-2">
            <div style="display: flex; flex-direction: column; justify-content: center;">
              <span class="agent-eyebrow">WEBINAR EJECUTIVO B2B</span>
              <h1 class="agent-display">«UX en la <span class="highlight-cyan">era agéntica</span>»</h1>
              <p class="agent-subtitle" style="font-size: 1.35rem; font-weight: 600; color: var(--bp-fg); margin-bottom: 12px;">
                La relevancia del diseño UX/UI para el crecimiento empresarial.
              </p>
              <p class="agent-subtitle" style="margin-bottom: 24px;">
                Cómo pasar de jugar con prompts aislados a desplegar agentes autónomos que generan rentabilidad real, sin perder el criterio humano ni la gobernanza.
              </p>
              <div style="display: flex; align-items: center; gap: 14px; background: var(--bp-surface-elevated); padding: 12px 18px; border-radius: var(--radius); border: 1px solid var(--bp-line); width: fit-content;">
                <img src="assets/maria_de_buen_foto.png" alt="María de Buen" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--agent-cyan);">
                <div>
                  <div style="font-weight: 700; font-size: 15px;">María de Buen</div>
                  <div style="font-size: 12px; color: var(--bp-muted);">CEO & Co-founder @BluePixel · #1 Ranking UX/UI México</div>
                </div>
              </div>
            </div>
            <div class="figma-preview-card" title="Portada Oficial de la Conferencia">
              <img src="assets/talent_01_cover.png" alt="Portada Oficial Era Agéntica">
            </div>
          </div>
        `,
        notes: {
          time: "1:30 min",
          keyIdea: "Apertura del webinar: la IA no reemplaza al diseño; los agentes autónomos hacen que el diseño UX sea la única garantía de rentabilidad.",
          speech: "Bienvenidos a todos a este webinar. Durante los últimos dos años, todas las empresas han estado obsesionadas con una sola pregunta: '¿Qué modelo de inteligencia artificial deberíamos usar?'. Hoy quiero demostrarles que esa pregunta ya es obsoleta. En esta nueva era, la tecnología no es el diferenciador: la adopción humana lo es. Hoy les voy a mostrar por qué el diseño UX/UI es el eslabón perdido que determina si los agentes autónomos multiplican las ganancias de tu empresa o se convierten en una inversión desperdiciada."
        }
      },
      {
        id: "02",
        eyebrow: "EL GRAN GIRO · NOVIEMBRE 2022 VS. HOY",
        title: "De los Prompts a la Autonomía: La nueva frontera.",
        subtitle: "En 2022 aprendimos a chatear con una IA; en 2026 los agentes toman acción directa en tus sistemas.",
        type: "HOOK",
        render: () => `
          <div class="grid-2">
            <div style="display: flex; flex-direction: column; justify-content: center;">
              <span class="agent-eyebrow">EL EFECTO NOVIEMBRE 2022</span>
              <h2 class="agent-title">La interfaz <span class="highlight-cyan">cambió el mundo</span></h2>
              <p class="agent-subtitle" style="margin-bottom: 20px;">
                Cuando ChatGPT alcanzó 100 millones de usuarios en dos meses, la IA subyacente ya existía desde hacía años. Lo que cambió todo fue quitar la fricción: un simple cuadro de texto con un botón de enviar.
              </p>
              <div class="agent-card card-cyan">
                <div class="takeaway-badge">El salto a 2026: Agentes Autónomos</div>
                <p style="font-size: 14px; color: var(--bp-fg); margin: 0; line-height: 1.5;">
                  Ya no se trata de que una persona se siente a escribir prompts. Los agentes de hoy operan en segundo plano, se comunican entre sí y ejecutan tareas en ERPs y bases de datos. <strong>El reto de diseño ya no es cómo chatear, sino cómo supervisar.</strong>
                </p>
              </div>
            </div>
            <div class="figma-preview-card" title="El Hook de OpenAI">
              <img src="assets/talent_02_hook.png" alt="Hook OpenAI y salto a agentes">
            </div>
          </div>
        `,
        notes: {

        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderCurrentSlide();
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < SLIDES.length) {
        currentSlide = index;
        renderCurrentSlide();
        closeGrid();
      }
    }

    function toggleNotes() {
      notesDrawer.classList.toggle('open');
      document.getElementById('btn-notes').classList.toggle('active', notesDrawer.classList.contains('open'));
    }

    function openGrid() {
      gridThumbnails.innerHTML = SLIDES.map((s, idx) => `
        <div class="thumb-card ${idx === currentSlide ? 'active' : ''}" onclick="goToSlide(${idx})">

        </div>
      `).join('');
      gridModal.classList.add('open');
    }

    function closeGrid() {
      gridModal.classList.remove('open');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('btn-theme').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    /* ───────── Eventos de Teclado y Botones ───────── */
    document.getElementById('btn-next').addEventListener('click', nextSlide);
    document.getElementById('btn-prev').addEventListener('click', prevSlide);

    document.getElementById('btn-grid').addEventListener('click', openGrid);
    document.getElementById('btn-close-grid').addEventListener('click', closeGrid);
    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('btn-theme').addEventListener('click', toggleTheme);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'PageUp':
          e.preventDefault();
          prevSlide();
          break;
        case 'n':

        case 'g':
        case 'G':

          break;
        case 'f':
        case 'F':
          toggleFullscreen();
          break;
        case 't':
        case 'T':
          toggleTheme();
          break;
        case 'Escape':
