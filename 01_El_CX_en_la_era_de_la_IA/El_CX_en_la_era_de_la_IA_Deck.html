<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El CX en la era de la IA · María De Buen | BluePixel 2027</title>
  
  <!-- Tipografía Oficial Onest y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ───────── BPDS 2027 Tokens OKLCH ───────── */
    :root, [data-theme="dark"] {
      --bp-bg: oklch(0.12 0.035 248);
      --bp-bg-2: oklch(0.16 0.045 248);
      --bp-bg-surface: oklch(0.18 0.04 248);
      --bp-fg: oklch(0.98 0.003 250);
      --bp-muted: oklch(0.82 0.018 248);
      --bp-dim: oklch(0.70 0.014 248);
      --bp-line: color-mix(in oklab, var(--bp-fg) 10%, transparent);
      --bp-line-strong: color-mix(in oklab, var(--bp-fg) 18%, transparent);
      
      /* Paleta de Firma María De Buen: Orange CX & Navy Deep */
      --bp-accent: #e75125;
      --bp-accent-2: #ff6b4a;
      --bp-accent-glow: #ff8a65;
      
      --bp-build: #16A2CD;
      --bp-evolve: #AFE139;
      --bp-warning: #f59e0b;
      --bp-danger: #ef4444;

      --bp-gradient-accent: linear-gradient(135deg, #e75125 0%, #ff6b4a 100%);
      --bp-gradient-surface: linear-gradient(180deg, var(--bp-bg) 0%, var(--bp-bg-2) 100%);
      --radius: 0.625rem;
      --shadow-elevated: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--bp-line);
    }

    [data-theme="light"] {
      --bp-bg: #f8fafc;
      --bp-bg-2: #f1f5f9;
      --bp-bg-surface: #ffffff;
      --bp-fg: #090d16;
      --bp-muted: #334155;
      --bp-dim: #64748b;
      --bp-line: #e2e8f0;
      --bp-line-strong: #cbd5e1;
      
      --bp-accent: #e75125;
      --bp-accent-2: #d9481e;
      --bp-accent-glow: #ff6b4a;
      
      --bp-build: #0284c7;
      --bp-evolve: #15803d;
      --bp-warning: #b45309;
      --bp-danger: #b91c1c;

      --bp-gradient-accent: linear-gradient(135deg, #e75125 0%, #ff6b4a 100%);
      --bp-gradient-surface: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      --shadow-elevated: 0 10px 30px -10px rgba(15, 23, 42, 0.08), 0 0 0 1px var(--bp-line);
    }

    /* ───────── Reset & Base ───────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bp-bg);
      color: var(--bp-fg);
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 24px;
      border-bottom: 1px solid var(--bp-line);
      background: var(--bp-bg-2);
      flex-shrink: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: var(--bp-gradient-accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--bp-dim);
      background: color-mix(in oklab, var(--bp-fg) 6%, transparent);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--bp-line);
      color: var(--bp-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: 'Onest', sans-serif;
    }

    .btn-action:hover, .btn-action.active {
      background: color-mix(in oklab, var(--bp-fg) 8%, transparent);
      color: var(--bp-fg);
      border-color: var(--bp-line-strong);
    }

    .btn-action.primary {
      background: var(--bp-accent);
      color: #fff;
      border-color: var(--bp-accent);
    }

    .btn-action.primary:hover {
      filter: brightness(1.1);
    }

    /* Barra de Progreso */
    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--bp-line);
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: var(--bp-gradient-accent);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 7.7%;
    }

    /* Contenedor del Slide Canvas */
    .viewport {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, color-mix(in oklab, var(--bp-accent) 6%, transparent) 0%, transparent 70%);
    }

    .slide-stage {
      width: 100%;
      max-width: 1380px;
      aspect-ratio: 16 / 9;
      background: var(--bp-bg-surface);
      border: 1px solid var(--bp-line-strong);
      border-radius: 14px;
      box-shadow: var(--shadow-elevated);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Interior del Slide */
    .slide-header {
      padding: 20px 36px 12px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bp-line);
      flex-shrink: 0;
    }

    .slide-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--bp-dim);
    }

    .slide-speaker {
      font-size: 12px;
      color: var(--bp-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-speaker img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--bp-accent);
    }

    .slide-content {
      flex: 1 1 auto;
      padding: 28px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .slide-footer {
      padding: 12px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--bp-line);
      background: color-mix(in oklab, var(--bp-bg) 40%, transparent);
      flex-shrink: 0;
      font-size: 12px;
      color: var(--bp-dim);
    }

    /* Elementos Tipográficos BPDS */
    .bp-display {
      font-size: clamp(1.8rem, 3.2vw, 3.2rem);
      font-weight: 300;
      letter-spacing: -0.035em;
      line-height: 1.12;
      color: var(--bp-fg);
      margin-bottom: 14px;
    }

    .bp-title {
      font-size: clamp(1.4rem, 2.3vw, 2.1rem);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--bp-fg);
      margin-bottom: 12px;
    }

    .bp-subtitle {
      font-size: clamp(0.95rem, 1.2vw, 1.15rem);
      color: var(--bp-muted);
      font-weight: 300;
      line-height: 1.5;
      max-width: 65ch;
    }

    .bp-highlight {
      background: var(--bp-gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    .bp-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--bp-build);
      margin-bottom: 8px;
      display: block;
    }

    /* Tarjetas y Layouts */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 20px;
      align-items: center;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: color-mix(in oklab, var(--bp-fg) 3%, transparent);
      border: 1px solid var(--bp-line);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .card:hover {
      border-color: var(--bp-line-strong);
      transform: translateY(-2px);
    }

    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--bp-accent);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--bp-fg);
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--bp-muted);
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      width: fit-content;
    }

    .badge.cyan { background: rgba(22, 162, 205, 0.15); color: #16A2CD; border: 1px solid rgba(22, 162, 205, 0.3); }
    .badge.green { background: rgba(175, 225, 57, 0.15); color: #AFE139; border: 1px solid rgba(175, 225, 57, 0.3); }
    .badge.purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }

    /* Imagen Figma interactiva */
    .figma-preview-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--bp-line-strong);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: #000;
    }

    .figma-preview-box:hover {
      transform: scale(1.015);
      box-shadow: 0 14px 40px rgba(0, 86, 224, 0.3);
      border-color: var(--bp-accent);
    }

    .figma-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .figma-badge-overlay {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--bp-line);
      color: var(--bp-fg);
      font-size: 10.5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Barra Inferior */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 24px;
      border-top: 1px solid var(--bp-line);
      background: var(--bp-bg-2);
      flex-shrink: 0;
      z-index: 50;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--bp-fg);
      min-width: 70px;
      text-align: center;
    }

    .btn-nav {
      background: color-mix(in oklab, var(--bp-fg) 6%, transparent);
      border: 1px solid var(--bp-line);
      color: var(--bp-fg);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s ease;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--bp-accent);
      color: #fff;
      border-color: var(--bp-accent);
    }

    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Drawer de Notas del Orador */
    .notes-drawer {
      position: absolute;
      right: 0;
      top: 60px;
      bottom: 64px;
      width: 430px;
      background: var(--bp-bg-surface);
      border-left: 1px solid var(--bp-line-strong);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.4);
      z-index: 60;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .notes-drawer.open {
      transform: translateX(0);
    }

    .notes-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--bp-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .notes-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--bp-muted);
    }

    .notes-speech {
      background: color-mix(in oklab, var(--bp-accent) 8%, transparent);
      border-left: 3px solid var(--bp-accent);
      padding: 14px 16px;
      border-radius: 0 6px 6px 0;
      font-style: italic;
      color: var(--bp-fg);
    }

    .notes-meta-box {
      background: color-mix(in oklab, var(--bp-fg) 3%, transparent);
      border: 1px solid var(--bp-line);
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Modal Cuadrícula */
    .grid-modal {
      position: absolute;
      inset: 60px 0 64px 0;
      background: rgba(10, 14, 26, 0.94);
      backdrop-filter: blur(12px);
      z-index: 80;
      padding: 36px;
      overflow-y: auto;
      display: none;
    }

    .grid-modal.open {
      display: block;
    }

    .grid-container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .thumb-card {
      background: var(--bp-bg-surface);
      border: 1px solid var(--bp-line);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
      aspect-ratio: 16 / 10;
      position: relative;
    }

    .thumb-card:hover, .thumb-card.active {
      border-color: var(--bp-accent);
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0, 86, 224, 0.2);
    }

    .thumb-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--bp-dim);
    }

    .thumb-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--bp-fg);
      line-height: 1.3;
    }

    .thumb-type {
      margin-top: auto;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--bp-build);
    }

    /* Lightbox Modal para Ver Imagen en Grande */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--bp-line);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .luma-banner {
      background: linear-gradient(90deg, rgba(22, 162, 205, 0.12), rgba(175, 225, 57, 0.12));
      border: 1px solid rgba(22, 162, 205, 0.3);
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12px;
    }

    @media (max-width: 960px) {
      .grid-3, .grid-5, .grid-2 { grid-template-columns: 1fr; }
      .slide-stage { aspect-ratio: auto; min-height: 520px; }
      .notes-drawer { width: 100%; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-logo">BP</div>
      <div class="brand-title">Conferencias Dirección General</div>
      <span class="brand-tag">DECK 01 · FIGMA CANON</span>
    </div>

    <div class="top-actions">
      <button class="btn-action" id="btn-theme" title="Cambiar Tema (T)">
        <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
      </button>
      <button class="btn-action" id="btn-grid" title="Ver Cuadrícula (G)">
        <span>▦</span> Cuadrícula
      </button>
      <button class="btn-action" id="btn-notes" title="Notas del Orador (N)">
        <span>📝</span> Notas de Orador
      </button>
      <button class="btn-action primary" id="btn-fs" title="Pantalla Completa (F)">
        <span>⛶</span> Presentar
      </button>
    </div>
  </header>

  <!-- Barra de Progreso Superior -->
  <div class="progress-track">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- Viewport de Presentación -->
  <main class="viewport">
    <div class="slide-stage" id="slide-stage">
      <!-- Inyectado dinámicamente -->
    </div>
  </main>

  <!-- Barra Inferior de Controles -->
  <footer class="bottom-bar">
    <div class="nav-group">
      <span style="font-size: 13px; color: var(--bp-muted); font-weight: 500;" id="slide-name-label">
        El CX en la era de la IA
      </span>
    </div>

    <div class="nav-group">
      <button class="btn-nav" id="btn-prev" title="Lámina Anterior (←)">‹</button>
      <div class="counter" id="slide-counter">01 / 13</div>
      <button class="btn-nav" id="btn-next" title="Lámina Siguiente (→)">›</button>
    </div>

    <div class="nav-group">
      <span class="badge green">● FIGMA VERIFIED</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--bp-dim);">
        Atajos: ← → | Espacio | N | G | F
      </span>
    </div>
  </footer>

  <!-- Drawer Lateral: Notas del Orador -->
  <aside class="notes-drawer" id="notes-drawer">
    <div class="notes-header">
      <div class="notes-title">
        <span>🎙️</span> Guion Verbatim de María De Buen
      </div>
      <button class="btn-action" id="btn-close-notes" style="padding: 4px 8px;">✕</button>
    </div>
    <div class="notes-body" id="notes-content">
      <!-- Inyectado dinámicamente -->
    </div>
  </aside>

  <!-- Modal Cuadrícula / Overview -->
  <div class="grid-modal" id="grid-modal">
    <div style="max-width: 1280px; margin: 0 auto 24px auto; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em;">Todas las Láminas de la Conferencia (13)</h2>
      <button class="btn-action" id="btn-close-grid">Cerrar (Esc)</button>
    </div>
    <div class="grid-container" id="grid-container">
      <!-- Inyectado dinámicamente -->
    </div>
  </div>

  <!-- Lightbox Modal para Ver Artefacto de Figma en Alta Resolución -->
  <div class="lightbox-modal" id="lightbox-modal">
    <button class="lightbox-close" id="btn-close-lightbox">✕ Cerrar (Esc)</button>
    <img src="" class="lightbox-img" id="lightbox-img" alt="Figma Render">
  </div>
</div>

<script>
  /* ───────── Base de Datos de las 13 Láminas con Imágenes de Figma ───────── */
  const SLIDES = [
    {
      id: "01",
      eyebrow: "PORTADA OFICIAL · FIGMA 1013:7",
      title: "El CX en la era de la IA",
      subtitle: "Cómo la IA está redefiniendo las reglas de CX",
      type: "PORTADA",
      render: () => `
        <div class="grid-2" style="height: 100%; margin-top: 0; align-items: center;">

  /* ───────── Estado y Variables ───────── */
  let currentIndex = 0;
  let notesOpen = false;
  let gridOpen = false;

  /* ───────── Elementos DOM ───────── */

  const slideCounter = document.getElementById("slide-counter");
  const slideNameLabel = document.getElementById("slide-name-label");
  const progressBar = document.getElementById("progress-bar");
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  const notesDrawer = document.getElementById("notes-drawer");
  const notesContent = document.getElementById("notes-content");
  const btnNotes = document.getElementById("btn-notes");
  const btnCloseNotes = document.getElementById("btn-close-notes");
  const gridModal = document.getElementById("grid-modal");
  const gridContainer = document.getElementById("grid-container");
  const btnGrid = document.getElementById("btn-grid");
  const btnCloseGrid = document.getElementById("btn-close-grid");
  const btnTheme = document.getElementById("btn-theme");
  const themeIcon = document.getElementById("theme-icon");
  const themeText = document.getElementById("theme-text");
  const btnFs = document.getElementById("btn-fs");
  const lightboxModal = document.getElementById("lightbox-modal");
  const lightboxImg = document.getElementById("lightbox-img");
  const btnCloseLightbox = document.getElementById("btn-close-lightbox");

  /* ───────── Renderizado del Slide Activo ───────── */
  function renderSlide(index) {
    if (index < 0 || index >= SLIDES.length) return;
    currentIndex = index;
    const slide = SLIDES[index];

    // Renderizado en canvas
    slideStage.innerHTML = `
      <div class="slide-header">
        <div class="slide-meta">${slide.eyebrow} · [${slide.id}/13]</div>
        <div class="slide-speaker">
          <img src="assets/maria_de_buen_foto.png" alt="María de Buen">
          <span>María De Buen</span> · CEO BluePixel
        </div>
      </div>
      <div class="slide-content">
        ${slide.render()}
      </div>
      <div class="slide-footer">
        <div>BluePixel 2027 · Conferencia Magistral «El CX en la era de la IA»</div>
        <div style="font-family: 'JetBrains Mono', monospace;">SLIDE ${slide.id} · ${slide.type}</div>
      </div>
    `;

    // Actualizar Controles
    slideCounter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
    slideNameLabel.textContent = `${slide.id} · ${slide.title}`;
    progressBar.style.width = `${((index + 1) / SLIDES.length) * 100}%`;
    btnPrev.disabled = index === 0;
    btnNext.disabled = index === SLIDES.length - 1;

    // Actualizar Notas del Orador
    notesContent.innerHTML = `
      <div class="notes-meta-box">
        <div><strong>Lámina:</strong> ${slide.id} · ${slide.title}</div>
        <div><strong>Tiempo estimado:</strong> <span style="color: var(--bp-accent); font-weight: 600;">${slide.notes.time}</span></div>
        <div><strong>Idea Clave:</strong> ${slide.notes.keyIdea}</div>
      </div>
      <div>
        <div style="font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--bp-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace;">
          GUION VERBATIM SUGERIDO:
        </div>
        <div class="notes-speech">
          "${slide.notes.speech}"
        </div>
      </div>
      <div class="luma-banner">
        <div><strong>🔗 Conexión Webinar Luma (20-Nov):</strong> Fundamento de por qué los algoritmos sin empatía conductual generan fricción y abandono.</div>
      </div>
    `;

    // Actualizar estado en cuadrícula
    document.querySelectorAll(".thumb-card").forEach((c, i) => {
      c.classList.toggle("active", i === index);
    });
  }

  /* ───────── Navegación ───────── */
  function nextSlide() {
    if (currentIndex < SLIDES.length - 1) {
      renderSlide(currentIndex + 1);
    }
  }

  function prevSlide() {
    if (currentIndex > 0) {
      renderSlide(currentIndex - 1);
    }
  }

  btnNext.addEventListener("click", nextSlide);
  btnPrev.addEventListener("click", prevSlide);

  /* ───────── Atajos de Teclado ───────── */
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
      e.preventDefault();
      nextSlide();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      prevSlide();
    } else if (e.key === "Home") {
      e.preventDefault();
      renderSlide(0);
    } else if (e.key === "End") {
      e.preventDefault();
      renderSlide(SLIDES.length - 1);
    } else if (e.key.toLowerCase() === "n") {
      toggleNotes();
    } else if (e.key.toLowerCase() === "g") {
      toggleGrid();
    } else if (e.key.toLowerCase() === "f") {
      toggleFullscreen();
    } else if (e.key.toLowerCase() === "t") {
      toggleTheme();
    } else if (e.key === "Escape") {
      if (lightboxModal.classList.contains("open")) closeLightbox();
      else if (gridOpen) toggleGrid();
      else if (notesOpen) toggleNotes();
    }
  });

  /* ───────── Lightbox Modal ───────── */
  window.openLightbox = function(src) {
    lightboxImg.src = src;
    lightboxModal.classList.add("open");
  };

  function closeLightbox() {
    lightboxModal.classList.remove("open");
    lightboxImg.src = "";
  }

  btnCloseLightbox.addEventListener("click", closeLightbox);
  lightboxModal.addEventListener("click", (e) => {
    if (e.target === lightboxModal) closeLightbox();
  });

  /* ───────── Drawer de Notas ───────── */
  function toggleNotes() {
    notesOpen = !notesOpen;
    notesDrawer.classList.toggle("open", notesOpen);
    btnNotes.classList.toggle("active", notesOpen);
  }

  btnNotes.addEventListener("click", toggleNotes);
  btnCloseNotes.addEventListener("click", toggleNotes);

  /* ───────── Cuadrícula / Overview ───────── */
  function initGrid() {
    gridContainer.innerHTML = SLIDES.map((s, i) => `
      <div class="thumb-card ${i === currentIndex ? 'active' : ''}" onclick="selectFromGrid(${i})">
        <div class="thumb-num">SLIDE ${s.id}</div>
        <div class="thumb-title">${s.title}</div>
        <div class="thumb-type">${s.type} · ${s.notes.time}</div>
      </div>
    `).join("");
  }

  function toggleGrid() {
    gridOpen = !gridOpen;
    gridModal.classList.toggle("open", gridOpen);
    btnGrid.classList.toggle("active", gridOpen);
    if (gridOpen) initGrid();
  }

  btnGrid.addEventListener("click", toggleGrid);
  btnCloseGrid.addEventListener("click", toggleGrid);

  window.selectFromGrid = function(i) {
    renderSlide(i);
    toggleGrid();
  };

  /* ───────── Toggle de Tema Claro/Oscuro ───────── */
  function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute("data-theme") || "dark";
    const newTheme = currentTheme === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", newTheme);
    themeIcon.textContent = newTheme === "dark" ? "☀️" : "🌙";
    themeText.textContent = newTheme === "dark" ? "Modo Claro" : "Modo Oscuro";
  }

  btnTheme.addEventListener("click", toggleTheme);

  /* ───────── Pantalla Completa ───────── */
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  btnFs.addEventListener("click", toggleFullscreen);

  // Inicialización
  initGrid();
  renderSlide(0);
</script>
